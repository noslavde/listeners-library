name: macOS experimental

on:
  push:
    tags: ['macos-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-experimental-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: Apple-Silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      LL_MAC_TARGET: ${{ matrix.target }}
      LL_NOTICES_TARGET: ${{ matrix.target }}
      VITE_APP_CHANNEL: macos-experimental
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Verify isolated Mac release version
        run: node scripts/check-macos-tag.mjs
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            src-tauri/target
          key: macos-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            macos-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
      - name: Fetch locked native packages
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run format:check
      - name: Audit native dependencies
        if: matrix.arch == 'Apple-Silicon'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock
      - name: Prepare frontend and platform notices
        run: node scripts/prepare-macos.mjs
      - name: Test native storage, account lifecycle and controls
        run: |
          # Compile before opening the test vault; Intel cold builds can exceed
          # a new Keychain's default idle-lock interval.
          cargo test --no-run --release --locked --target "$LL_MAC_TARGET" --manifest-path src-tauri/Cargo.toml
          # Ephemeral runner; synthetic test records only, no user account.
          security create-keychain -p synthetic-ci-only "$RUNNER_TEMP/listeners-library-tests.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/listeners-library-tests.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/listeners-library-tests.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/listeners-library-tests.keychain-db"
          security unlock-keychain -p synthetic-ci-only "$RUNNER_TEMP/listeners-library-tests.keychain-db"
          cargo test --release --locked --target "$LL_MAC_TARGET" --manifest-path src-tauri/Cargo.toml
      - name: Remove synthetic test Keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/listeners-library-tests.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/listeners-library-tests.keychain-db"
          fi
      - name: Build ad-hoc signed experimental disk image
        run: npm run build:macos -- --target "$LL_MAC_TARGET" --ci
      - name: Verify app signature and architecture
        run: |
          set -euo pipefail
          app="src-tauri/target/$LL_MAC_TARGET/release/bundle/macos/Listeners Library Experimental.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/listeners-library"
      - name: Prepare separate test download
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p deployment/macos
          count=$(find "src-tauri/target/$LL_MAC_TARGET/release/bundle/dmg" -name '*.dmg' | wc -l | tr -d ' ')
          test "$count" = 1
          source=$(find "src-tauri/target/$LL_MAC_TARGET/release/bundle/dmg" -name '*.dmg')
          version=$(node -p "require('./package.json').version")
          cp "$source" "deployment/macos/Listeners-Library-$version-macOS-$ARCH-EXPERIMENTAL.dmg"
          cp docs/MACOS_EXPERIMENTAL.md deployment/macos/READ-ME-FIRST.md
          cp LICENSE deployment/macos/LICENSE.txt
          cp src-tauri/resources/THIRD_PARTY_LICENSES.txt deployment/macos/THIRD_PARTY_LICENSES.txt
          (cd deployment/macos && shasum -a 256 *.dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Listeners-Library-macOS-${{ matrix.arch }}-EXPERIMENTAL
          path: deployment/macos/
          if-no-files-found: error
          retention-days: 14
      - name: Cache native compilation for the next test build
        if: always() && !cancelled() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            src-tauri/target
          key: macos-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ github.sha }}

  side-release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Listeners-Library-macOS-*-EXPERIMENTAL
          path: artifacts
      - name: Create a draft side release only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/check-macos-tag.mjs
          mkdir deployment
          cp artifacts/*/*.dmg deployment/
          cp docs/MACOS_EXPERIMENTAL.md deployment/READ-ME-FIRST.md
          cp LICENSE deployment/LICENSE.txt
          for arch in Apple-Silicon Intel; do
            cp "artifacts/Listeners-Library-macOS-$arch-EXPERIMENTAL/THIRD_PARTY_LICENSES.txt" "deployment/THIRD_PARTY_LICENSES-$arch.txt"
          done
          (cd deployment && sha256sum *.dmg > SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo 'Release already exists; preserving its assets.'
            exit 0
          fi
          gh release create "$TAG" deployment/* --verify-tag --draft --prerelease --latest=false \
            --title "Listener's Library — macOS experimental alpha 1 (UNTESTED)" \
            --notes-file docs/MACOS_EXPERIMENTAL.md
