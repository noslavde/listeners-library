name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach installers to (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name == 'pull_request' && github.ref || github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        env:
          BUILD_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $tauri) { throw 'Frontend and installer versions differ.' }
          $tag = $env:RELEASE_TAG
          if (!$tag -and $env:BUILD_REF.StartsWith('refs/tags/')) { $tag = $env:BUILD_REF.Substring(10) }
          if ($tag) {
            if ($tag.StartsWith('-')) { throw 'Release tags cannot begin with a dash.' }
            git show-ref --verify --quiet "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Release target must be an existing tag.' }
          }
          if (($env:EVENT_NAME -eq 'push' -and $tag -or $tag -match '^v[0-9]') -and $tag -ne "v$version") {
            throw 'Release tag must match the application version.'
          }
      - name: Select stable Rust MSVC
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure verified native Perl
        run: ./scripts/ci-perl.ps1
      - name: Cache native dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-2022-rust-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-2022-rust-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
      - run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low
      - run: npm test
      - run: npm run format:check
      - name: Install pinned Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked native dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Check release attachment logic
        if: github.event_name != 'release' && inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-workflow.mjs
      - name: Fetch locked native dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare embedded frontend and dependency notices
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native release build
        run: npm run test:native -- --release --locked
      - name: Build Windows installer
        run: npm run build:windows
      - name: Prepare reviewed download files
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path deployment -Force | Out-Null
          $product = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          $source = "src-tauri/target/release/bundle/nsis/${product}_${version}_x64-setup.exe"
          $filename = "Listeners-Library-${version}-Windows-x64-Setup.exe"
          Copy-Item -LiteralPath $source -Destination "deployment/$filename"
          $hash = (Get-FileHash -LiteralPath "deployment/$filename" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -LiteralPath deployment/SHA256SUMS.txt
          Copy-Item -LiteralPath docs/TESTER_GUIDE.md -Destination deployment/TESTER_GUIDE.md
          Copy-Item -LiteralPath docs/PRIVACY.md -Destination deployment/PRIVACY.md
          Copy-Item -LiteralPath LICENSE -Destination deployment/LICENSE.txt
          $notes = "docs/RELEASE_NOTES_$version.md"
          if (Test-Path -LiteralPath $notes) { Copy-Item -LiteralPath $notes -Destination deployment/RELEASE_NOTES.md }
          Copy-Item -LiteralPath src-tauri/resources/THIRD_PARTY_LICENSES.txt -Destination deployment/THIRD_PARTY_LICENSES.txt
      - name: Upload Windows test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Listeners-Library-Windows-x64
          path: deployment/
          if-no-files-found: error
          retention-days: 14

  release-assets:
    if: github.event_name == 'release' || inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Listeners-Library-Windows-x64
          path: deployment
      - name: Attach installer or create draft test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          EXISTING_RELEASE_ONLY: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            # Preserve an existing installer's bytes on reruns. Generate any
            # missing checksum from that actual published download.
            installer=$(find deployment -maxdepth 1 -name '*-Setup.exe' -printf '%f\n')
            if [ -z "$installer" ]; then echo 'Installer artifact missing' >&2; exit 1; fi
            assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            if printf '%s\n' "$assets" | grep -Fxq "$installer"; then
              mkdir -p existing
              gh release download "$RELEASE_TAG" --pattern "$installer" --dir existing
              (cd existing && sha256sum "$installer") > deployment/SHA256SUMS.txt
            fi
            for file in deployment/*; do
              name=$(basename "$file")
              if printf '%s\n' "$assets" | grep -Fxq "$name"; then
                echo "Preserving existing asset: $name"
              else
                gh release upload "$RELEASE_TAG" "$file"
              fi
            done
          else
            if [ "$EXISTING_RELEASE_ONLY" = 'true' ]; then
              echo 'The requested release could not be read; no new release was created.' >&2
              exit 1
            fi
            if [ -f deployment/RELEASE_NOTES.md ]; then
              gh release create "$RELEASE_TAG" deployment/* --verify-tag --draft --prerelease \
                --title "Listener's Library $RELEASE_TAG beta" --notes-file deployment/RELEASE_NOTES.md
            else
              gh release create "$RELEASE_TAG" deployment/* --verify-tag --draft --prerelease \
                --title "Listener's Library $RELEASE_TAG beta" \
                --notes "Download the Windows x64 Setup.exe under Assets to install. Source-code archives are for developers. Unsigned beta; read TESTER_GUIDE.md and PRIVACY.md before installing."
            fi
          fi
