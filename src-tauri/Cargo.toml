[package]
name = "listeners-library"
version = "0.2.7"
license = "MIT"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
url = "2"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
sha2 = "0.10"
ring = "0.17.14"
zeroize = "1"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
axum = "0.8"
open = "5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62.2", features = ["Foundation", "Media", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
